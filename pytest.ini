[pytest]
# Offline tests only: synthetic data, no database. `python_files` is narrowed so
# tests/functional_tests/env_test.py, which needs live credentials, isn't collected.
testpaths = gcp_postgres_sandbox/tests gcp_postgres_sandbox/pit/tests
python_files = test_*.py
pythonpath = gcp_postgres_sandbox gcp_postgres_sandbox/technical_analysis gcp_postgres_sandbox/backtesting
